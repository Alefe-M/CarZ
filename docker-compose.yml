version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: carz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carz_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carz_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-carz_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carz_admin} -d ${POSTGRES_DB:-carz_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carz_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: carz_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@carz.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - carz_network

volumes:
  postgres_data:
    driver: local

networks:
  carz_network:
    driver: bridge

