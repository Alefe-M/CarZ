openapi: 3.0.3
info:
  title: CarZ - Multi-tenant Garage & Vehicle Management API
  version: 1.3.0
  description: API REST para gerenciamento multi-tenant de garagens, veículos, gastos diretos de peças e serviços, vendas e Tabela FIPE.

paths:
  # =========================================================================
  # INTEGRAÇÃO TABELA FIPE (PARALLELUM API PROXY)
  # =========================================================================
  /api/v1/fipe/marcas:
    get:
      summary: Listar marcas de carros da Tabela FIPE (com cache)
      responses:
        "200":
          description: Lista de marcas

  /api/v1/fipe/marcas/{marcaId}/modelos:
    get:
      summary: Listar modelos de uma marca FIPE
      parameters:
        - name: marcaId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lista de modelos

  /api/v1/fipe/marcas/{marcaId}/modelos/{modeloId}/anos:
    get:
      summary: Listar anos disponíveis para um modelo FIPE
      parameters:
        - name: marcaId
          in: path
          required: true
          schema: { type: string }
        - name: modeloId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lista de anos

  /api/v1/fipe/marcas/{marcaId}/modelos/{modeloId}/anos/{anoId}:
    get:
      summary: Consultar valor de mercado e detalhes oficiais FIPE
      parameters:
        - name: marcaId
          in: path
          required: true
          schema: { type: string }
        - name: modeloId
          in: path
          required: true
          schema: { type: string }
        - name: anoId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dados consolidados e valor em Reais da FIPE

  # =========================================================================
  # GARAGENS (TENANTS) & MEMBROS
  # =========================================================================
  /api/v1/garages:
    get:
      summary: Listar todas as garagens que o usuário participa
      responses:
        "200":
          description: Lista de garagens
    post:
      summary: Criar uma nova garagem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, example: "Alpha Motors" }
                slug: { type: string, example: "alpha-motors" }
      responses:
        "201":
          description: Garagem criada com sucesso

  # =========================================================================
  # VEÍCULOS (ISOLADOS POR GARAGEM)
  # =========================================================================
  /api/v1/garages/{garageId}/vehicles:
    get:
      summary: Listar veículos do pátio da garagem com filtros e totais
      parameters:
        - name: garageId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [PREPARACAO, A_VENDA, VENDIDO] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Lista de veículos da garagem

    post:
      summary: Cadastrar nova entrada de veículo na garagem
      parameters:
        - name: garageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plate, brand, model, year_model, acquisition_price, acquisition_date]
              properties:
                plate: { type: string, example: "BRA2E19" }
                vin: { type: string, example: "9BWZZZ377VT004251" }
                renavam: { type: string, example: "12345678901" }
                brand: { type: string, example: "Toyota" }
                model: { type: string, example: "Corolla" }
                version: { type: string, example: "XEi 2.0 Flex" }
                year_manufacture: { type: integer, example: 2021 }
                year_model: { type: integer, example: 2022 }
                color: { type: string, example: "Prata" }
                mileage_in: { type: integer, example: 45000 }
                acquisition_price: { type: number, example: 95000.00 }
                acquisition_date: { type: string, format: date }
      responses:
        "201":
          description: Veículo cadastrado

  /api/v1/garages/{garageId}/vehicles/{id}:
    get:
      summary: Obter ficha completa do veículo (incluindo discriminação de peças, mão de obra e custo total)
      parameters:
        - name: garageId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detalhes do veículo e dossiê de custos

  # =========================================================================
  # GASTOS E CUSTOS (PEÇAS E SERVIÇOS DIRETOS NO VEÍCULO)
  # =========================================================================
  /api/v1/garages/{garageId}/expenses/vehicle:
    post:
      summary: Lançar gasto no veículo (com discriminação de peças e mão de obra)
      parameters:
        - name: garageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, category, description, expense_date]
              properties:
                vehicle_id: { type: string, format: uuid }
                category: { type: string, example: "MANUTENCAO_MECANICA" }
                description: { type: string, example: "Troca de pastilhas de freio dianteiras" }
                parts_cost: { type: number, example: 20.00, description: "Gasto com Peças" }
                labor_cost: { type: number, example: 50.00, description: "Gasto com Mão de Obra" }
                amount: { type: number, example: 70.00, description: "Total do Gasto" }
                expense_date: { type: string, format: date }
      responses:
        "201":
          description: Despesa agregada e dossiê atualizado

  /api/v1/garages/{garageId}/expenses/general:
    get:
      summary: Listar despesas gerais/fixas da garagem
      parameters:
        - name: garageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista de despesas fixas
    post:
      summary: Cadastrar despesa geral/fixa da garagem (aluguel, luz, marketing)
      parameters:
        - name: garageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description, amount, due_date]
              properties:
                category: { type: string, example: "MARKETING_ANUNCIOS" }
                description: { type: string, example: "Mensalidade Webmotors" }
                amount: { type: number, example: 1800.00 }
                due_date: { type: string, format: date }
      responses:
        "201":
          description: Despesa cadastrada

  # =========================================================================
  # VENDAS E DASHBOARD
  # =========================================================================
  /api/v1/garages/{garageId}/sales:
    post:
      summary: Registrar venda de veículo com apuração de lucro e Trade-in
      parameters:
        - name: garageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, customer_id, final_sale_price, sale_date, payment_method]
              properties:
                vehicle_id: { type: string, format: uuid }
                customer_id: { type: string, format: uuid }
                final_sale_price: { type: number, example: 110000.00 }
                sale_date: { type: string, format: date }
                payment_method: { type: string, example: "MISTO" }
                trade_in_vehicle:
                  type: object
                  nullable: true
                  properties:
                    plate: { type: string, example: "RIO2A18" }
                    brand: { type: string, example: "Chevrolet" }
                    model: { type: string, example: "Onix" }
                    year_model: { type: integer, example: 2019 }
                    agreed_trade_value: { type: number, example: 30000.00 }
      responses:
        "201":
          description: Venda finalizada com sucesso

  /api/v1/garages/{garageId}/dashboard/metrics:
    get:
      summary: Obter métricas consolidadas, DRE e resumo de manutenções
      parameters:
        - name: garageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Resumo executivo da garagem
